<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MyRPA Bridge</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #3367d6;
    }
    #status {
      margin-top: 10px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }
    .success {
      background: #d4edda !important;
      color: #155724 !important;
    }
    .error {
      background: #f8d7da !important;
      color: #721c24 !important;
    }
  </style>
</head>
<body>
  <h3>MyRPA Bridge</h3>
  
  <button id="testHighlight">Test Highlight (h1)</button>
  <button id="clearHighlights">Clear Highlights</button>
  <button id="testNative">Test Native Connection</button>
  
  <div id="status">Ready</div>
  
  <script src="popup.js"></script>
</body>
</html>
